<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 50" width="290" height="50">
  <defs>
    <linearGradient id="logo-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C38"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="logo-needle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF8C38"/>
    </linearGradient>
  </defs>

  <!-- Speedometer & Wheel Emblem -->
  <g transform="translate(6, 6)">
    <!-- Outer Arc -->
    <path d="M 6 29 A 19 19 0 1 1 32 29" fill="none" stroke="url(#logo-orange-grad)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Speed Lines / Dash Ticks -->
    <path d="M 10 25 L 14 23" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M 19 8 L 19 13" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <path d="M 28 25 L 24 23" stroke="url(#logo-orange-grad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Aerodynamic Center Speed Needle -->
    <circle cx="19" cy="22" r="3.2" fill="#FFFFFF"/>
    <polygon points="19,19.5 30,12 21,24" fill="url(#logo-needle-grad)"/>
    <circle cx="19" cy="22" r="1.5" fill="#FF6B00"/>

    <!-- Dynamic Motion Base Line -->
    <path d="M 4 33 L 34 33" stroke="url(#logo-orange-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 36.5 L 28 36.5" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(54, 33)">
    <text font-family="'Barlow', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">
      Concesionaria Esteban
    </text>
  </g>
</svg>
