<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Vehículos — Panel de Gestión</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/panel.css">
  <script src="../js/supabase-config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/db.js"></script>
</head>
<body class="admin">

  <div id="admin-overlay" class="admin-overlay" aria-hidden="true"></div>

  <aside id="admin-sidebar" class="admin__sidebar" aria-label="Navegación del panel">
    <div class="admin__sidebar-header">
      <a href="dashboard.html" class="admin__sidebar-logo">
        <img src="../img/logo.svg" alt="Concesionaria Esteban" width="150" height="38">
      </a>
      <button id="admin-sidebar-close" class="admin__sidebar-close" aria-label="Cerrar menú">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <nav class="admin__sidebar-nav">
      <a href="dashboard.html" class="admin__sidebar-link admin__sidebar-link--active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11 2 11.5 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        <span>Vehículos</span>
      </a>
      <a href="vehiculo-form.html" class="admin__sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Nuevo Vehículo</span>
      </a>
      <div class="admin__sidebar-separator"></div>
      <a href="../index.html" target="_blank" rel="noopener" class="admin__sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>Ver Sitio Web</span>
      </a>
      <button type="button" class="admin__sidebar-link" id="btn-logout">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Cerrar Sesión</span>
      </button>
    </nav>
  </aside>

  <div class="admin__main">
    <header class="admin__topbar">
      <div class="admin__topbar-left">
        <button id="admin-hamburger" class="admin__hamburger" aria-label="Abrir menú lateral">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="admin__topbar-title">Vehículos</h1>
      </div>
      <a href="vehiculo-form.html" class="btn btn--primary btn--sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo
      </a>
    </header>

    <div class="admin__content">
      <div class="panel-filters">
        <div class="search-bar" style="max-width:280px">
          <svg class="search-bar__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search-input" class="search-bar__input" placeholder="Buscar marca, modelo…" aria-label="Buscar vehículo">
        </div>
        <div class="select-wrapper" style="min-width:130px">
          <select id="filter-type" class="form__select form__select--sm" aria-label="Filtrar por tipo">
            <option value="">Todos los tipos</option>
            <option value="auto">Autos</option>
            <option value="moto">Motos</option>
          </select>
        </div>
        <div class="select-wrapper" style="min-width:150px">
          <select id="filter-status" class="form__select form__select--sm" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="disponible">Disponible</option>
            <option value="reservado">Reservado</option>
            <option value="vendido">Vendido</option>
          </select>
        </div>
        <button id="btn-clear-filters" class="btn btn--ghost btn--sm">Limpiar</button>
      </div>

      <div class="panel-table-wrap">
        <!-- Sin skeleton — carga instantánea desde localStorage -->
        <table class="panel-table" id="vehicles-table" hidden>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Vehículo</th>
              <th>Precio</th>
              <th>Estado</th>
              <th>Destacado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="vehicles-tbody"></tbody>
        </table>

        <div id="empty-state" class="admin-empty" hidden>
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11 2 11.5 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
          <p>No hay vehículos. <a href="vehiculo-form.html">Cargá el primero</a>.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="confirm-modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal__box">
      <h2 class="modal__title" id="confirm-title">¿Eliminar vehículo?</h2>
      <p class="modal__body">Esta acción es permanente y no se puede deshacer.</p>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="confirm-cancel">Cancelar</button>
        <button type="button" class="btn btn--danger" id="confirm-delete">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script>
    // Session enforcement and all data authorization are backed by Supabase.

    // ── Toast
    function showToast(msg, type) {
      type = type || 'success';
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      t.className = 'toast toast--' + type;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(function () { t.classList.add('toast--visible'); }, 10);
      setTimeout(function () { t.classList.remove('toast--visible'); setTimeout(function () { t.remove(); }, 300); }, 3000);
    }

    // ── Sidebar
    var sidebar = document.getElementById('admin-sidebar');
    var overlay = document.getElementById('admin-overlay');
    document.getElementById('admin-hamburger').addEventListener('click', function () { sidebar.classList.add('open'); overlay.classList.add('active'); });
    document.getElementById('admin-sidebar-close').addEventListener('click', function () { sidebar.classList.remove('open'); overlay.classList.remove('active'); });
    overlay.addEventListener('click', function () { sidebar.classList.remove('open'); overlay.classList.remove('active'); });
    document.getElementById('btn-logout').addEventListener('click', function () {
      import('../js/panel/auth-panel.js').then(({ logout }) => logout());
    });

    // ── Estado global
    var allVehicles    = [];
    var deleteTargetId = null;

    // ── Escape HTML
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── Render principal: decide qué mostrar
    function renderTable(vehicles) {
      var table = document.getElementById('vehicles-table');
      var empty = document.getElementById('empty-state');
      var tbody = document.getElementById('vehicles-tbody');

      if (!vehicles || vehicles.length === 0) {
        // Sin vehículos
        table.hidden = true;
        empty.hidden = false;
        return;
      }

      // Con vehículos
      empty.hidden = true;
      table.hidden = false;

      tbody.innerHTML = vehicles.map(function (v) {
        var images  = Array.isArray(v.images) ? v.images : [];
        var thumb   = '';
        var primary = images.find(function (i) { return typeof i === 'object' && i.isPrimary; });
        if (!primary && images.length) primary = images[0];
        if (primary) thumb = typeof primary === 'string' ? primary : (primary.url || '');

        var price       = new Intl.NumberFormat('es-PY').format(v.price || 0);
        var statusClass = { disponible:'badge--disponible', reservado:'badge--reservado', vendido:'badge--vendido' }[v.status] || '';

        return '<tr data-id="' + escapeHtml(v.id) + '">' +
          '<td class="panel-table__thumb">' + (thumb ? '<img src="' + escapeHtml(thumb) + '" alt="" loading="lazy" width="60" height="45">' : '<div class="thumb-placeholder"></div>') + '</td>' +
          '<td><div class="vehicle-name">' + escapeHtml(v.brand) + ' ' + escapeHtml(v.model) + '</div><div class="vehicle-meta">' + escapeHtml(v.year) + ' &middot; ' + (v.type === 'auto' ? 'Auto' : 'Moto') + '</div></td>' +
          '<td class="price-cell">&#8370; ' + price + '</td>' +
          '<td><select class="status-select badge ' + statusClass + '" data-id="' + escapeHtml(v.id) + '" aria-label="Cambiar estado">' +
            '<option value="disponible"' + (v.status === 'disponible' ? ' selected' : '') + '>Disponible</option>' +
            '<option value="reservado"'  + (v.status === 'reservado'  ? ' selected' : '') + '>Reservado</option>' +
            '<option value="vendido"'    + (v.status === 'vendido'    ? ' selected' : '') + '>Vendido</option>' +
          '</select></td>' +
          '<td class="text-center"><button type="button" class="btn-featured ' + (v.featured ? 'btn-featured--on' : '') + '" data-id="' + escapeHtml(v.id) + '" title="' + (v.featured ? 'Quitar de destacados' : 'Destacar en inicio') + '">' + (v.featured ? '⭐' : '☆') + '</button></td>' +
          '<td class="actions-cell"><a href="vehiculo-form.html?id=' + escapeHtml(v.id) + '" class="btn btn--ghost btn--sm">Editar</a><button type="button" class="btn btn--danger btn--sm btn-delete" data-id="' + escapeHtml(v.id) + '">Eliminar</button></td>' +
        '</tr>';
      }).join('');

      // Status change
      tbody.querySelectorAll('.status-select').forEach(function (sel) {
        sel.addEventListener('change', function (e) {
          var id = e.target.dataset.id;
          try {
            DB.updateVehicleStatus(id, e.target.value);
            import('../js/panel/vehicle-sync.js?v=20261119-2').then(({ syncVehicle }) => syncVehicle(id)).catch(function (err) {
              showToast(window.vehicleErrorMessage ? window.vehicleErrorMessage(err) : 'No se pudo sincronizar el vehículo con Supabase.', 'error');
            });
            showToast('Estado actualizado');
            var sc = { disponible:'badge--disponible', reservado:'badge--reservado', vendido:'badge--vendido' }[e.target.value] || '';
            e.target.className = 'status-select badge ' + sc;
          } catch (err) { showToast('Error: ' + err.message, 'error'); }
        });
      });

      // Featured
      tbody.querySelectorAll('.btn-featured').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.dataset.id;
          try {
            DB.toggleFeatured(id);
            import('../js/panel/vehicle-sync.js?v=20261119-2').then(({ syncVehicle }) => syncVehicle(id)).catch(function (err) {
              showToast(window.vehicleErrorMessage ? window.vehicleErrorMessage(err) : 'No se pudo sincronizar el vehículo con Supabase.', 'error');
            });
            var veh = allVehicles.find(function (x) { return String(x.id) === String(id); });
            if (veh) {
              veh.featured = !veh.featured;
              btn.textContent = veh.featured ? '⭐' : '☆';
              btn.classList.toggle('btn-featured--on', veh.featured);
              btn.title = veh.featured ? 'Quitar de destacados' : 'Destacar en inicio';
              showToast(veh.featured ? 'Marcado como destacado' : 'Quitado de destacados');
            }
          } catch (err) { showToast('Error: ' + err.message, 'error'); }
        });
      });

      // Delete buttons
      tbody.querySelectorAll('.btn-delete').forEach(function (btn) {
        btn.addEventListener('click', function () {
          deleteTargetId = btn.dataset.id;
          openConfirmModal();
        });
      });
    }

    // ── Cargar vehículos
    function loadVehicles() {
      try {
        allVehicles = DB.getVehicles() || [];
      } catch (e) {
        allVehicles = [];
        console.error('[Dashboard] Error:', e);
      }
      renderTable(allVehicles);
    }

    // ── Filtros
    var searchTimer;
    function applyFilters() {
      var q   = document.getElementById('search-input').value.toLowerCase();
      var typ = document.getElementById('filter-type').value;
      var sta = document.getElementById('filter-status').value;
      var filtered = allVehicles.filter(function (v) {
        return (!q   || (v.brand + ' ' + v.model).toLowerCase().includes(q)) &&
               (!typ || v.type   === typ) &&
               (!sta || v.status === sta);
      });
      renderTable(filtered);
    }
    document.getElementById('search-input').addEventListener('input', function () { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilters, 300); });
    document.getElementById('filter-type').addEventListener('change', applyFilters);
    document.getElementById('filter-status').addEventListener('change', applyFilters);
    document.getElementById('btn-clear-filters').addEventListener('click', function () {
      document.getElementById('search-input').value  = '';
      document.getElementById('filter-type').value   = '';
      document.getElementById('filter-status').value = '';
      renderTable(allVehicles);
    });

    // ── Modal eliminar
    var confirmModal = document.getElementById('confirm-modal');
    function openConfirmModal()  { confirmModal.hidden = false; confirmModal.classList.add('active'); }
    function closeConfirmModal() { confirmModal.classList.remove('active'); confirmModal.hidden = true; }

    document.getElementById('confirm-cancel').addEventListener('click', function () { closeConfirmModal(); deleteTargetId = null; });

    document.getElementById('confirm-delete').addEventListener('click', async function () {
      if (!deleteTargetId) return;
      var btn = document.getElementById('confirm-delete');
      btn.disabled = true; btn.textContent = 'Eliminando…';
      try {
        var sync = await import('../js/panel/vehicle-sync.js?v=20261119-2');
        await sync.deleteSyncedVehicle(deleteTargetId);
        DB.deleteVehicle(deleteTargetId);
        allVehicles = allVehicles.filter(function (v) { return String(v.id) !== String(deleteTargetId); });
        renderTable(allVehicles);
        showToast('Vehículo eliminado');
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      } finally {
        closeConfirmModal();
        deleteTargetId  = null;
        btn.disabled    = false;
        btn.textContent = 'Sí, eliminar';
      }
    });

    // ── Iniciar
    loadVehicles();
    window.addEventListener('vehicles:sync-complete', loadVehicles);
  </script>
  <script type="module">
    import { requireAuth } from '../js/panel/auth-panel.js';
    import { vehicleErrorMessage } from '../js/panel/error-messages.js';
    const session = await requireAuth('index.html');
    if (session) {
      window.vehicleErrorMessage = vehicleErrorMessage;
      try {
        const { syncAllVehicles } = await import('../js/panel/vehicle-sync.js?v=20261119-2');
        await syncAllVehicles();
        window.dispatchEvent(new Event('vehicles:sync-complete'));
      } catch (error) {
        console.error('[Panel] No se pudo sincronizar el inventario:', error);
        window.showToast?.(vehicleErrorMessage(error), 'error');
      }
    }
  </script>
</body>
</html>
