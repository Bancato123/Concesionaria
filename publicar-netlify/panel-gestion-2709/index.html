<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso al Panel — Concesionaria Kevin</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/panel.css">
  <script src="../js/supabase-config.js"></script>
</head>
<body class="admin-login">

  <main class="admin-login__card" id="login-card" role="main">
    <div class="admin-login__logo">
      <img src="../img/logo.svg" alt="Concesionaria Kevin" width="200" height="50">
    </div>

    <div class="admin-login__header">
      <h1 class="admin-login__title">Panel de Gestión</h1>
      <p class="admin-login__subtitle">Ingresá tu usuario y contraseña para continuar</p>
    </div>

    <div class="admin-login__error" id="login-error" role="alert" aria-live="assertive" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="login-error-msg">Error de acceso</span>
    </div>

    <form id="login-form" class="admin-login__form" novalidate>
      <div class="form__group">
        <label for="login-user" class="form__label">Usuario</label>
        <input
          type="email"
          id="login-user"
          name="usuario"
          class="form__input"
          placeholder="correo@dominio.com"
          required
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form__group">
        <label for="login-pass" class="form__label">Contraseña</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="login-pass"
            name="password"
            class="form__input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" class="btn-toggle-pass" id="toggle-pass" aria-label="Mostrar contraseña">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn--primary btn--block admin-login__submit">
        <span id="login-btn-text">Iniciar Sesión</span>
        <svg id="login-spinner" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin" hidden><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
      </button>
    </form>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module">
    import { login, getSession } from '../js/panel/auth-panel.js';
    const form = document.getElementById('login-form');
    const button = document.getElementById('login-submit-btn');
    const error = document.getElementById('login-error');
    const errorMsg = document.getElementById('login-error-msg');
    const panelBasePath = window.location.pathname
      .replace(/index\.html$/i, '')
      .replace(/\/?$/, '/');
    const goToDashboard = () => location.replace(`${panelBasePath}dashboard.html`);
    document.getElementById('toggle-pass').addEventListener('click', () => {
      const input = document.getElementById('login-pass');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
    try { if (await getSession()) goToDashboard(); } catch {}
    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      error.hidden = true;
      try {
        await login(document.getElementById('login-user').value.trim(), document.getElementById('login-pass').value);
        goToDashboard();
      } catch (err) {
        errorMsg.textContent = err.message || 'No se pudo iniciar sesión.';
        error.hidden = false;
        document.getElementById('login-pass').value = '';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
